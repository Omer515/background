<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,orientation=landscape"/>
<title>Desert Storm</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}

html,body{
  width:100%;height:100%;
  overflow:hidden;
  background:#020308;
  font-family:'Cairo',sans-serif;
}

/* Force landscape */
@media(orientation:portrait){
  body{transform:rotate(90deg);transform-origin:50% 50%;width:100vh;height:100vw;position:fixed;top:calc(50vw - 50vh);left:calc(50vh - 50vw);}
}

canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}

/* ─── OVERLAYS ─── */
.ov-top{position:fixed;top:0;left:0;right:0;height:30%;background:linear-gradient(180deg,rgba(2,3,8,0.9) 0%,transparent 100%);z-index:1;pointer-events:none}
.ov-bot{position:fixed;bottom:0;left:0;right:0;height:35%;background:linear-gradient(0deg,rgba(2,3,8,0.95) 0%,transparent 100%);z-index:1;pointer-events:none}
.ov-left{position:fixed;top:0;left:0;bottom:0;width:55%;background:linear-gradient(90deg,rgba(2,3,8,0.88) 0%,rgba(2,3,8,0.5) 60%,transparent 100%);z-index:1;pointer-events:none}
.ov-vign{position:fixed;inset:0;background:radial-gradient(ellipse 100% 100% at 62% 40%,transparent 25%,rgba(2,3,8,0.7) 100%);z-index:1;pointer-events:none}
.scanline{position:fixed;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px)}

/* ─── CHARACTER ZONE ─── */
.char-zone{
  position:fixed;
  right:-2%;bottom:0;
  width:52%;height:100%;
  z-index:3;pointer-events:none;
  display:flex;align-items:flex-end;justify-content:center;
}
.char-glow{
  position:fixed;
  right:8%;bottom:0;
  width:36%;height:50%;
  background:radial-gradient(ellipse 100% 60% at 50% 100%,rgba(255,100,0,0.22) 0%,transparent 70%);
  z-index:2;pointer-events:none;
  animation:glowBreath 4s ease-in-out infinite;
}
.char-glow2{
  position:fixed;
  right:12%;bottom:0;
  width:28%;height:70%;
  background:radial-gradient(ellipse 60% 80% at 50% 80%,rgba(255,160,30,0.1) 0%,transparent 70%);
  z-index:2;pointer-events:none;
}
@keyframes glowBreath{0%,100%{opacity:.7}50%{opacity:1}}

.char-svg{
  width:100%;height:95%;
  filter:drop-shadow(0 0 50px rgba(255,90,0,0.35)) drop-shadow(0 0 100px rgba(255,40,0,0.15));
  animation:charFloat 6s ease-in-out infinite;
}
@keyframes charFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ─── LENS FLARE ─── */
.flare{
  position:fixed;z-index:4;pointer-events:none;
  border-radius:50%;
  animation:flarePulse 5s ease-in-out infinite;
}
.flare1{width:3px;height:3px;background:#fff;box-shadow:0 0 6px 3px rgba(255,220,100,0.8),0 0 20px 8px rgba(255,160,0,0.4);right:38%;top:28%;animation-delay:0s}
.flare2{width:2px;height:2px;background:#fff;box-shadow:0 0 4px 2px rgba(255,200,100,0.6),0 0 14px 5px rgba(255,140,0,0.3);right:42%;top:32%;animation-delay:1s}
.flare3{width:1px;height:1px;background:rgba(255,220,150,0.8);box-shadow:0 0 6px 4px rgba(255,180,80,0.3);right:36%;top:24%;animation-delay:2s}
@keyframes flarePulse{0%,100%{opacity:.6}50%{opacity:1}}

/* ─── HUD CORNERS ─── */
.hud{position:fixed;inset:0;z-index:10;pointer-events:none}
.hud::before,.hud::after,.hud2::before,.hud2::after{content:'';position:fixed;width:50px;height:50px}
.hud::before{top:8px;left:8px;border-top:1.5px solid rgba(255,160,0,0.55);border-left:1.5px solid rgba(255,160,0,0.55)}
.hud::after{top:8px;right:8px;border-top:1.5px solid rgba(255,160,0,0.55);border-right:1.5px solid rgba(255,160,0,0.55)}
.hud2{position:fixed;inset:0;z-index:10;pointer-events:none}
.hud2::before{bottom:8px;left:8px;border-bottom:1.5px solid rgba(255,160,0,0.55);border-left:1.5px solid rgba(255,160,0,0.55)}
.hud2::after{bottom:8px;right:8px;border-bottom:1.5px solid rgba(255,160,0,0.55);border-right:1.5px solid rgba(255,160,0,0.55)}

/* ─── TOP BAR ─── */
.top-bar{
  position:fixed;top:0;left:0;right:0;
  height:clamp(44px,8vh,56px);
  z-index:20;
  display:flex;align-items:center;
  padding:0 clamp(14px,3vw,24px);
  gap:clamp(10px,2vw,20px);
}
.logo-mark{
  display:flex;align-items:center;gap:8px;
  margin-left:auto;
}
.logo-icon-wrap{
  width:clamp(28px,4vw,36px);height:clamp(28px,4vw,36px);
  background:linear-gradient(135deg,#ff6000,#cc2000);
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(14px,2vw,18px);
  box-shadow:0 0 14px rgba(255,80,0,0.5);
}
.logo-text{
  font-size:clamp(13px,2vw,17px);
  font-weight:900;color:#fff;
  letter-spacing:2px;
  text-shadow:0 0 20px rgba(255,120,0,0.6);
}

.tb-divider{width:1px;height:22px;background:rgba(255,255,255,0.1)}

.player-pill{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;
  padding:4px 10px 4px 6px;
}
.pa{
  width:clamp(22px,3.5vw,28px);height:clamp(22px,3.5vw,28px);
  background:linear-gradient(135deg,#2a1a06,#0e0804);
  border:1.5px solid rgba(255,140,0,0.5);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(10px,1.6vw,13px);
}
.pname{font-size:clamp(10px,1.6vw,13px);font-weight:700;color:#fff}
.plvl{
  font-size:clamp(8px,1.3vw,10px);font-weight:700;
  background:linear-gradient(90deg,#ff8c00,#ffcc00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

.currency-strip{display:flex;align-items:center;gap:clamp(8px,1.5vw,14px)}
.cur{
  display:flex;align-items:center;gap:5px;
  background:rgba(0,0,0,0.35);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  padding:3px 10px 3px 8px;
  font-size:clamp(10px,1.6vw,13px);
  font-weight:700;
}
.cur.gold{color:#ffd700;border-color:rgba(255,215,0,0.2)}
.cur.gems{color:#c084fc;border-color:rgba(192,132,252,0.2)}
.cur.cash{color:#6ee7b7;border-color:rgba(110,231,183,0.2)}
.cur-icon{font-size:1.1em}
.cur-add{
  width:clamp(16px,2.5vw,20px);height:clamp(16px,2.5vw,20px);
  background:rgba(255,255,255,0.1);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(9px,1.3vw,11px);color:rgba(255,255,255,0.5);
  cursor:pointer;
}

.top-settings{
  width:clamp(28px,4vw,36px);height:clamp(28px,4vw,36px);
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(13px,2vw,17px);cursor:pointer;
  transition:background .2s;
}
.top-settings:active{background:rgba(255,255,255,0.14)}

/* ─── LEFT PANEL ─── */
.left-panel{
  position:fixed;
  top:0;left:0;bottom:0;
  width:50%;
  z-index:15;
  display:flex;flex-direction:column;
  justify-content:center;
  padding:clamp(50px,10vh,80px) 0 clamp(80px,14vh,110px) clamp(18px,4vw,40px);
  gap:clamp(8px,1.5vh,16px);
}

.eyebrow{
  display:flex;align-items:center;gap:8px;
  font-size:clamp(8px,1.4vw,11px);
  font-weight:700;
  color:rgba(255,170,60,0.8);
  letter-spacing:4px;
  text-transform:uppercase;
}
.eyebrow-line{flex:1;max-width:40px;height:1px;background:rgba(255,150,0,0.4)}

.title-en{
  font-size:clamp(10px,1.8vw,14px);
  font-weight:700;
  color:rgba(255,200,100,0.5);
  letter-spacing:8px;
  text-transform:uppercase;
}

.title-ar{
  font-size:clamp(28px,6.5vw,58px);
  font-weight:900;
  line-height:0.9;
  letter-spacing:-1px;
  background:linear-gradient(175deg,#ffffff 0%,#ffe4a0 35%,#ff8c00 65%,#cc2200 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 30px rgba(255,120,0,0.5));
  position:relative;
}
.title-ar::after{
  content:attr(data-t);
  position:absolute;inset:0;
  background:inherit;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  opacity:0;
  animation:glitch 10s infinite;
}
@keyframes glitch{
  0%,94%,100%{opacity:0;transform:none}
  95%{opacity:0.7;transform:translateX(-3px)}
  96%{opacity:0;transform:none}
  97%{opacity:0.5;transform:translateX(3px)}
  98%{opacity:0;transform:none}
}

.title-sep{
  width:clamp(60px,12vw,120px);height:2px;
  background:linear-gradient(90deg,#ff8c00,#ffcc00,rgba(255,140,0,0.2));
  position:relative;overflow:hidden;
}
.title-sep::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.9),transparent);
  animation:sepSweep 3s ease-in-out infinite;
}
@keyframes sepSweep{0%{transform:translateX(-100%)}60%,100%{transform:translateX(300%)}}

.tagline{
  font-size:clamp(9px,1.5vw,12px);
  font-weight:600;
  color:rgba(200,180,140,0.65);
  letter-spacing:2px;
  max-width:clamp(180px,35vw,280px);
  line-height:1.6;
}

/* PLAY button */
.btn-play-wrap{margin-top:clamp(4px,1vh,10px)}

.btn-play{
  position:relative;
  height:clamp(44px,8vh,58px);
  width:clamp(160px,26vw,220px);
  border:none;background:none;cursor:pointer;
  border-radius:4px;overflow:hidden;
  transition:transform .08s;
}
.btn-play:active{transform:scale(0.97)}

.bp-bg{
  position:absolute;inset:0;border-radius:4px;
  background:linear-gradient(135deg,#ff7200 0%,#e03200 45%,#aa1c00 100%);
  box-shadow:
    0 0 0 1px rgba(255,120,0,0.4),
    0 3px 0 #6a0e00,
    0 6px 25px rgba(255,60,0,0.45),
    0 0 60px rgba(255,80,0,0.12),
    inset 0 1px 0 rgba(255,180,80,0.3),
    inset 0 -1px 0 rgba(0,0,0,0.3);
}
.bp-shine{position:absolute;inset:0;border-radius:4px;background:linear-gradient(180deg,rgba(255,255,255,0.18) 0%,transparent 55%)}
.bp-shimmer{
  position:absolute;top:0;left:-100%;width:45%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.28),transparent);
  animation:shimmer 3.5s ease-in-out infinite;
}
@keyframes shimmer{0%{left:-100%}55%,100%{left:200%}}

.bp-content{
  position:relative;z-index:2;
  height:100%;display:flex;align-items:center;justify-content:center;
  gap:clamp(8px,1.5vw,12px);
  font-size:clamp(14px,2.5vw,20px);
  font-weight:900;color:#fff;
  letter-spacing:3px;
  text-shadow:0 2px 8px rgba(0,0,0,0.5);
}
.bp-arrow{
  width:clamp(22px,3.5vw,30px);height:clamp(22px,3.5vw,30px);
  background:rgba(255,255,255,0.18);
  border:1px solid rgba(255,255,255,0.35);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.55em;padding-right:1px;
}

/* Season tag */
.season-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(200,40,0,0.2);
  border:1px solid rgba(220,60,0,0.35);
  border-radius:3px;
  padding:3px 10px;
  font-size:clamp(8px,1.3vw,10px);
  font-weight:700;color:#ff7060;
  letter-spacing:3px;
  width:fit-content;
  margin-top:clamp(4px,1vh,8px);
}
.season-dot{width:5px;height:5px;border-radius:50%;background:#ff3030;box-shadow:0 0 6px #ff3030;animation:sdot 1.2s ease-in-out infinite}
@keyframes sdot{0%,100%{opacity:1}50%{opacity:.2}}

/* ─── BOTTOM NAV ─── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  height:clamp(64px,12vh,84px);
  z-index:20;
  display:flex;align-items:stretch;
  padding:0 clamp(14px,3vw,28px) clamp(6px,1.5vh,12px);
  gap:clamp(4px,1vw,8px);
}

.nav-item{
  flex:1;max-width:clamp(70px,12vw,100px);
  position:relative;cursor:pointer;
  border:none;background:none;
  border-radius:6px;overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;
  transition:transform .1s;
}
.nav-item:active{transform:scale(0.94)}

.nav-item.active .ni-bg{background:rgba(255,140,0,0.12);border-color:rgba(255,140,0,0.35)}
.nav-item.active .ni-label{color:#ffa030}
.nav-item.active .ni-bar{opacity:1}

.ni-bg{
  position:absolute;inset:0;border-radius:6px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  transition:background .2s,border-color .2s;
}
.nav-item:hover .ni-bg{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.1)}

.ni-bar{
  position:absolute;top:0;left:15%;right:15%;height:2px;
  background:linear-gradient(90deg,transparent,#ff9020,transparent);
  border-radius:0 0 2px 2px;
  opacity:0;
  transition:opacity .2s;
}

.ni-icon{position:relative;z-index:2;font-size:clamp(16px,3vw,22px);line-height:1}
.ni-label{position:relative;z-index:2;font-size:clamp(8px,1.4vw,11px);font-weight:700;color:rgba(200,180,150,0.7);letter-spacing:1px;transition:color .2s}

.ni-badge{
  position:absolute;top:4px;right:calc(50% - 14px);
  min-width:16px;height:16px;border-radius:8px;
  background:#ff2a2a;border:1.5px solid #020308;
  font-size:9px;font-weight:900;color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 8px rgba(255,42,42,0.6);
  z-index:3;
  animation:badge 1.8s ease-in-out infinite;
}
@keyframes badge{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

/* spacer between left nav and right nav */
.nav-spacer{flex:1}

/* play button in nav center */
.nav-play{
  flex:0 0 clamp(100px,16vw,140px);
  position:relative;cursor:pointer;
  border:none;background:none;
  border-radius:6px;overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;
  transition:transform .08s;
}
.nav-play:active{transform:scale(0.96)}

.np-bg{
  position:absolute;inset:0;border-radius:6px;
  background:linear-gradient(135deg,#ff7000,#e02800,#a01800);
  box-shadow:0 0 0 1px rgba(255,100,0,0.4),0 3px 0 #6a0e00,0 5px 20px rgba(255,60,0,0.4),inset 0 1px 0 rgba(255,180,80,0.25);
}
.np-shine{position:absolute;inset:0;border-radius:6px;background:linear-gradient(180deg,rgba(255,255,255,0.15) 0%,transparent 50%)}
.np-shimmer{
  position:absolute;top:0;left:-100%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
  animation:shimmer 3s ease-in-out infinite;
}
.np-content{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.np-icon{font-size:clamp(18px,3vw,24px);line-height:1}
.np-label{font-size:clamp(9px,1.5vw,12px);font-weight:900;color:#fff;letter-spacing:2px}

/* ─── MATCH INFO BAR ─── */
.match-bar{
  position:fixed;
  top:clamp(44px,8vh,56px);left:clamp(18px,4vw,40px);
  z-index:15;
  display:flex;align-items:center;gap:clamp(8px,1.5vw,14px);
  animation:fadeDown .8s .3s both;
}
.match-mode{
  display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,0.5);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;
  padding:4px 12px;
  backdrop-filter:blur(6px);
}
.mm-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;animation:sdot 2s ease-in-out infinite}
.mm-text{font-size:clamp(8px,1.4vw,11px);font-weight:700;color:rgba(255,255,255,0.7);letter-spacing:2px}

.match-players{
  display:flex;align-items:center;gap:5px;
  font-size:clamp(8px,1.4vw,11px);
  font-weight:700;
  color:rgba(200,180,140,0.6);
}

/* ─── ANIMATIONS ─── */
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.left-panel{animation:fadeIn .9s both}
.bottom-nav{animation:fadeUp .9s .2s both}
.top-bar{animation:fadeDown .9s both}

/* Ripple */
@keyframes rpl{to{transform:scale(40);opacity:0}}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="ov-top"></div>
<div class="ov-bot"></div>
<div class="ov-left"></div>
<div class="ov-vign"></div>
<div class="scanline"></div>

<!-- Character glow -->
<div class="char-glow"></div>
<div class="char-glow2"></div>

<!-- Character silhouette -->
<div class="char-zone">
<svg class="char-svg" viewBox="0 0 340 600" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="cg" x1=".5" y1="0" x2=".5" y2="1">
    <stop offset="0%" stop-color="#2c1c0a" stop-opacity=".95"/>
    <stop offset="50%" stop-color="#160e04" stop-opacity=".98"/>
    <stop offset="100%" stop-color="#050305" stop-opacity="1"/>
  </linearGradient>
  <linearGradient id="armorg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#241608"/>
    <stop offset="100%" stop-color="#100a04"/>
  </linearGradient>
  <filter id="glow2"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softglow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- Body aura -->
<ellipse cx="170" cy="320" rx="80" ry="220" fill="rgba(255,70,0,0.04)" filter="url(#softglow)"/>

<!-- ── LEGS ── -->
<path d="M138 420 L122 560 L145 562 L162 460 L178 460 L195 562 L218 560 L202 420 Z" fill="url(#cg)"/>
<!-- Boots -->
<path d="M121 556 L116 590 L148 590 L146 556 Z" fill="#100a04"/>
<path d="M194 556 L192 590 L224 590 L219 556 Z" fill="#100a04"/>
<path d="M117 564 L113 584" stroke="rgba(255,120,0,0.3)" stroke-width="2"/>
<path d="M219 564 L223 584" stroke="rgba(255,120,0,0.3)" stroke-width="2"/>
<!-- Boot soles -->
<path d="M113 588 L150 590 L150 594 L112 593 Z" fill="#0a0604"/>
<path d="M192 590 L226 588 L227 593 L191 594 Z" fill="#0a0604"/>
<!-- Knee pads -->
<ellipse cx="132" cy="470" rx="12" ry="10" fill="#1a1006" stroke="rgba(255,140,0,0.2)" stroke-width="1" transform="rotate(-5 132 470)"/>
<ellipse cx="208" cy="470" rx="12" ry="10" fill="#1a1006" stroke="rgba(255,140,0,0.2)" stroke-width="1" transform="rotate(5 208 470)"/>
<!-- Leg armor lines -->
<path d="M130 430 L128 500" stroke="rgba(255,100,0,0.12)" stroke-width="1.5"/>
<path d="M210 430 L212 500" stroke="rgba(255,100,0,0.12)" stroke-width="1.5"/>

<!-- ── TORSO ── -->
<path d="M110 265 L100 420 L240 420 L230 265 Z" fill="url(#cg)"/>
<!-- Chest plate -->

<script>
/* ══════════════════════════
   CANVAS ENGINE
══════════════════════════ */
const cv = document.getElementById('bg');
const cx = cv.getContext('2d');
let W, H;
function rsz(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight }
rsz(); window.addEventListener('resize',rsz);

/* Stars */
const stars = Array.from({length:160},()=>({
  x:Math.random(), y:Math.random()*0.6,
  r:Math.random()*1.1+0.2,
  a:Math.random()*0.7+0.2,
  sp:Math.random()*.003+.001,
  ph:Math.random()*Math.PI*2
}));

/* Embers */
class Ember{
  constructor(){ this.reset(true) }
  reset(init=false){
    this.x=(0.3+Math.random()*.5)*W;
    this.y=init?Math.random()*H:H*(0.6+Math.random()*.25);
    this.vx=(Math.random()-.5)*.6;
    this.vy=-(Math.random()*1.4+.5);
    this.life=1; this.dec=Math.random()*.009+.004;
    this.r=Math.random()*2.2+.4;
    this.spark=Math.random()<.3;
    this.hue=15+Math.random()*35;
  }
  tick(){
    this.x+=this.vx+Math.sin(Date.now()*.0012+this.y*.01)*.35;
    this.y+=this.vy; this.vy*=.999;
    this.life-=this.dec;
    if(this.life<=0) this.reset();
  }
  draw(){
    cx.save(); cx.globalAlpha=this.life*.9;
    if(this.spark){
      cx.strokeStyle=`hsl(${this.hue},100%,75%)`;
      cx.lineWidth=this.r*.5;
      cx.shadowColor=`hsl(${this.hue},100%,65%)`; cx.shadowBlur=7;
      cx.beginPath(); cx.moveTo(this.x,this.y);
      cx.lineTo(this.x-this.vx*6,this.y-this.vy*6); cx.stroke();
    } else {
      const g=cx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*2.5);
      g.addColorStop(0,`hsla(${this.hue+20},100%,92%,1)`);
      g.addColorStop(.4,`hsla(${this.hue},100%,62%,.8)`);
      g.addColorStop(1,`hsla(${this.hue-10},100%,40%,0)`);
      cx.fillStyle=g; cx.shadowColor=`hsl(${this.hue},100%,60%)`; cx.shadowBlur=14;
      cx.beginPath(); cx.arc(this.x,this.y,this.r*2.5,0,Math.PI*2); cx.fill();
    }
    cx.restore();
  }
}
const embers=Array.from({length:70},()=>new Ember());

/* Smoke wisps */
const wisps=Array.from({length:10},()=>({
  x:Math.random(), y:.55+Math.random()*.25,
  w:.12+Math.random()*.2, a:Math.random()*.05+.015,
  sp:(Math.random()*.00015+.00008)*(Math.random()<.5?1:-1),
  ph:Math.random()*Math.PI*2
}));

function drawSky(){
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#02030c'); g.addColorStop(.2,'#07050e');
  g.addColorStop(.38,'#110806'); g.addColorStop(.52,'#261408');
  g.addColorStop(.62,'#4e1e06'); g.addColorStop(.70,'#8a300a');
  g.addColorStop(.76,'#c84c0e'); g.addColorStop(.82,'#de6214');
  g.addColorStop(.88,'#b04010'); g.addColorStop(1,'#040208');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
}

function drawHorizon(){
  const y=H*.8;
  let g=cx.createRadialGradient(W*.6,y,0,W*.6,y,W*.55);
  g.addColorStop(0,'rgba(255,110,20,.24)'); g.addColorStop(.4,'rgba(255,60,0,.1)'); g.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  g=cx.createRadialGradient(W*.6,H*.76,0,W*.6,H*.76,W*.15);
  g.addColorStop(0,'rgba(255,220,80,.22)'); g.addColorStop(.35,'rgba(255,140,0,.1)'); g.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
}

function drawStars(t){
  cx.save();
  stars.forEach(s=>{
    const a=.3+.5*Math.sin(t*s.sp*1000+s.ph);
    cx.beginPath(); cx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    cx.fillStyle=`rgba(255,240,200,${a*s.a*.85})`;
    cx.shadowColor='rgba(255,230,180,.4)'; cx.shadowBlur=4;
    cx.fill();
  });
  cx.restore();
}

function drawDunes(){
  const sets=[
    {pts:[[0,.62],[.1,.55],[.22,.59],[.35,.52],[.48,.57],[.6,.50],[.72,.55],[.85,.49],[1,.54],[1,1],[0,1]],col:'#0e0804'},
    {pts:[[0,.70],[.08,.64],[.20,.68],[.34,.61],[.50,.67],[.63,.59],[.76,.65],[.90,.58],[1,.64],[1,1],[0,1]],col:'#170e06'},
    {pts:[[0,.79],[.10,.73],[.24,.77],[.40,.70],[.56,.76],[.68,.69],[.82,.75],[.94,.68],[1,.74],[1,1],[0,1]],col:'#201408'},
    {pts:[[0,.87],[.12,.82],[.28,.86],[.44,.79],[.60,.85],[.74,.78],[.88,.84],[1,.80],[1,1],[0,1]],col:'#2a1a0a'},
    {pts:[[0,.93],[.18,.89],[.38,.93],[.58,.87],[.76,.92],[.92,.87],[1,.91],[1,1],[0,1]],col:'#341e0c'},
  ];
  sets.forEach(({pts,col})=>{
    cx.beginPath(); pts.forEach(([x,y],i)=>i?cx.lineTo(x*W,y*H):cx.moveTo(x*W,y*H));
    cx.fillStyle=col; cx.fill();
  });
  // Sand ripples
  cx.strokeStyle='rgba(200,140,50,.1)'; cx.lineWidth=1;
  [[.05,.91,.20,.89],[.28,.92,.45,.90],[.55,.88,.72,.90],[.78,.91,.94,.89]].forEach(([x1,y1,x2,y2])=>{
    cx.beginPath(); cx.moveTo(x1*W,y1*H); cx.bezierCurveTo(x1*W+20,y1*H-4,x2*W-20,y2*H-4,x2*W,y2*H); cx.stroke();
  });
}

function drawWisps(t){
  wisps.forEach(w=>{
    const cx_=((w.x+t*w.sp)%1.4-.2)*W;
    const cy_=(w.y+Math.sin(t*.25+w.ph)*.015)*H;
    const g=cx.createRadialGradient(cx_,cy_,0,cx_,cy_,w.w*W*.5);
    g.addColorStop(0,`rgba(190,110,35,${w.a})`); g.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=g; cx.fillRect(0,0,W,H);
  });
}

/* Volumetric light shaft */
function drawLightShaft(t){
  cx.save();
  const x=W*.62, y=H*.78;
  const a=.04+.02*Math.sin(t*.5);
  cx.globalAlpha=a;
  const g=cx.createConicalGradient?null:null;
  // Simple fan rays
  for(let i=0;i<5;i++){
    const angle=-Math.PI*.5+(-0.18+i*.1);
    const len=H*.7;
    const spread=35+i*12;
    cx.beginPath();
    cx.moveTo(x,y);
    cx.lineTo(x+Math.cos(angle-spread*.008)*len, y+Math.sin(angle-spread*.008)*len);
    cx.lineTo(x+Math.cos(angle+spread*.008)*len, y+Math.sin(angle+spread*.008)*len);
    cx.closePath();
    const grad=cx.createLinearGradient(x,y,x,y+len);
    grad.addColorStop(0,'rgba(255,160,40,.12)');
    grad.addColorStop(1,'rgba(255,160,40,0)');
    cx.fillStyle=grad;
    cx.fill();
  }
  cx.restore();
}

function loop(ts){
  const t=ts/1000;
  cx.clearRect(0,0,W,H);
  drawSky(); drawHorizon(); drawStars(t);
  drawLightShaft(t); drawDunes(); drawWisps(t);
  embers.forEach(e=>{e.tick();e.draw()});
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ── Ripple ── */
function doRipple(btn,e){
  const old=btn.querySelector('.rpl'); if(old)old.remove();
  const r=btn.getBoundingClientRect();
  const x=(e.clientX??r.left+r.width/2)-r.left;
  const y=(e.clientY??r.top+r.height/2)-r.top;
  const el=document.createElement('span');
  el.className='rpl';
  el.style.cssText=`position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.2);width:10px;height:10px;left:${x-5}px;top:${y-5}px;transform:scale(0);animation:rpl .6s ease-out forwards;z-index:99;`;
  btn.appendChild(el);
}

/* ── Nav active ── */
function setActive(el,e){
  doRipple(el,e);
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
}
</script>
